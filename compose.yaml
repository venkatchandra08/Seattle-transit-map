services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit"]
      interval: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://transit:transit@db/transit
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
